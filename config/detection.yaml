# YOLOv8 Detection Configuration

model:
  name: "yolov8n"  # Options: yolov8n, yolov8s, yolov8m, yolov8l, yolov8x
  weights: "models/yolov8/yolov8n.pt"
  input_size: 640

detection:
  confidence_threshold: 0.5
  iou_threshold: 0.45
  max_detections: 100

classes:
  vehicle_classes: [2, 3, 5, 7]  # COCO: car, motorcycle, bus, truck
  class_names:
    2: "car"
    3: "motorcycle"
    5: "bus"
    7: "truck"

processing:
  batch_size: 1
  device: "cuda"  # Options: cuda, cpu, mps
  fp16: false     # Use half-precision for faster inference
